services:
  hub:
    build: .
    container_name: shard-link_hub
    volumes:
      # This is the "Dual-Boot Bridge"
      - ./data:/app/data
    depends_on:
      db:
        condition: service_started
      neo4j:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://sharduser:shardpass@db:5432/shardlink?sslmode=disable
      - DATABASE_PATH=/app/data/shard-link.db
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=shardpass
      - PUBLIC_URL=https://hub.izenberk.com
      - HUB_API_KEY=${HUB_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - EMBEDDING_MODE=${EMBEDDING_MODE:-none}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - MESH_LINK_THRESHOLD=${MESH_LINK_THRESHOLD:-0.70}
      - JANITOR_RESONANCE_THRESHOLD=${JANITOR_RESONANCE_THRESHOLD:-0.70}
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - shard-link-net

  db:
    image: pgvector/pgvector:pg17
    container_name: shard-link_db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_DB=shardlink
      - POSTGRES_USER=sharduser
      - POSTGRES_PASSWORD=shardpass
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - shard-link-net

  neo4j:
    image: neo4j:5.26.0
    container_name: shard-link_graph
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt Protocol (Go Driver)
    environment:
      - NEO4J_AUTH=neo4j/shardpass
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      # Give plugins permission to run unrestricted
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      # Memory Tuning: Prevent GC pauses and optimize page cache for the Knowledge Mesh
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./neo4j_plugins:/plugins
    networks:
      - shard-link-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: shard-link_tunnel
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - hub
    networks:
      - shard-link-net

networks:
  shard-link-net:
    driver: bridge
